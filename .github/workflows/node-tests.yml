name: Node.js tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**', 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
        # The user's Windows PC runs Node 26: test that combination too.
        include:
          - os: windows-latest
            node: 26.x
    env:
      HOST: 127.0.0.1
      AUTO_UPDATE: 'false'
      UPDATE_MANIFEST_URL: ''
      SIGNAL_LAB_OPEN_BROWSER: '0'
      TELEGRAM_NEWS_ALERTS: 'false'
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      TWELVE_DATA_API_KEY: ''
    steps:
      - name: Checkout PR code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24 action host
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24 action host
        with:
          node-version: ${{ matrix.node }}
      - name: Show runtime versions
        run: node --version && npm --version
      # package.json has no external dependencies or lockfile; no install is needed.
      # Real public-market checks are deliberately separate from offline CI.
      - name: Run unit and integration tests
        # A failed focused check must not silently skip the remaining test files.
        if: ${{ !cancelled() }}
        env:
          # runner.temp is available at step scope; never use a Windows user store.
          SIGNAL_LAB_DATA_DIR: ${{ runner.temp }}/signal-lab-tests-${{ matrix.node }}
        # Every existing *.test.mjs runs. Bounded concurrency is identical on
        # Windows/Linux; a leaked file process fails instead of waiting 10 min.
        run: npm run test:ci -- --concurrency 2 --file-timeout-ms 120000 --output-dir "${{ runner.temp }}/node-tests-${{ matrix.os }}-${{ matrix.node }}"
      - name: Preserve per-file TAP and lifecycle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified tag
        with:
          name: node-tests-${{ matrix.os }}-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/node-tests-${{ matrix.os }}-${{ matrix.node }}
            ${{ runner.temp }}/journal-tests-${{ matrix.os }}-${{ matrix.node }}
          if-no-files-found: warn
          retention-days: 7
