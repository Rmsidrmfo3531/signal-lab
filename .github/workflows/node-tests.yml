name: Node.js tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x, 24.x]
    env:
      HOST: 127.0.0.1
      AUTO_UPDATE: 'false'
      UPDATE_MANIFEST_URL: ''
      SIGNAL_LAB_OPEN_BROWSER: '0'
      TELEGRAM_NEWS_ALERTS: 'false'
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      TWELVE_DATA_API_KEY: ''
    steps:
      - name: Checkout PR code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24 action host
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, Node 24 action host
        with:
          node-version: ${{ matrix.node }}
      - name: Show runtime versions
        run: node --version && npm --version
      # package.json has no external dependencies or lockfile; no install is needed.
      # Real public-market checks are deliberately separate from offline CI.
      - name: Run unit and integration tests
        env:
          # runner.temp is available at step scope; never use a Windows user store.
          SIGNAL_LAB_DATA_DIR: ${{ runner.temp }}/signal-lab-tests-${{ matrix.node }}
        run: npm test

  report:
    name: PR 1 한국어 검증 보고
    needs: test
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
          github.event.pull_request.number == 1 &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # This job reads only the review document. It never runs PR application code.
      - name: Checkout review document
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: PR1_REVIEW_KO.md
          sparse-checkout-cone-mode: false
      - name: Create or update Korean verification comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9, Node 24 action host
        env:
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- signal-lab-pr1-verification -->';
            if (context.issue.number !== 1) throw new Error('PR #1 전용 보고입니다.');
            const headSha = context.payload.pull_request.head.sha;
            const current = await github.rest.pulls.get({ ...context.repo, pull_number: 1 });
            if (current.data.head.sha !== headSha) {
              core.notice('PR의 최신 커밋이 변경되어 이전 실행의 댓글 갱신을 건너뜁니다.');
              return;
            }
            const report = fs.readFileSync('PR1_REVIEW_KO.md', 'utf8');
            const labels = {
              success: '성공 — Node.js 22/24 · Linux/Windows 자동 검사 모두 통과',
              failure: '실패 — 하나 이상의 자동 검사가 실패했습니다. 로그를 확인하세요.',
              cancelled: '취소 — 전체 검사 완료를 확인할 수 없습니다.',
              skipped: '실행 안 됨 — 자동 검사 결과가 없습니다.'
            };
            const result = process.env.TEST_RESULT;
            const status = labels[result] || `확인 불가 (${result})`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/commit/${headSha}`;
            const body = `${marker}\n${report}\n\n---\n\n자동 검사 결과: **${status}**\n\n검사 커밋: [${headSha.slice(0, 7)}](${commitUrl})\n\n[이번 GitHub Actions 실행 로그](${runUrl})\n\n머지는 수행하지 않았습니다.\n`;
            const params = { ...context.repo, issue_number: 1 };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
